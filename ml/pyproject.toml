[project]
name = "retailiq-ml"
version = "0.1.0"
description = "RetailIQ forecasting, decision rules and Modal jobs"
requires-python = ">=3.11,<3.13"
dependencies = [
    "modal>=1.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "lightgbm>=4.3",
    "statsforecast>=1.7",
    "psycopg[binary]>=3.2",
    "supabase>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["retailiq_ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
